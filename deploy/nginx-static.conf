# Server-block fragment, not a complete virtual host.
# Keep Forge's root, TLS, ACME, and forge-conf includes.
# Replace the existing location / and static-asset locations with these.
index index.html;

location / {
    try_files $uri $uri/ =404;
    expires -1;
}

# Flutter uses stable asset filenames: revalidate on every visit/deployment.
location ~* \.(?:html|js|mjs|json|wasm|bin|otf|ttf|woff2?|frag|css|png|jpe?g|svg|ico)$ {
    try_files $uri =404;
    expires -1;
}

# This application has no PHP entry point.
# Replace any existing PHP handler with this location, rather than adding both.
location ~ \.php$ {
    return 404;
}
